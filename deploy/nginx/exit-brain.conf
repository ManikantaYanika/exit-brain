# Exit Brain web (apps/web, React Router framework mode, ssr:false + prerender).
# Serves the output of `npm run build` from apps/web/build/client.
#   - prerendered pages and assets: served as files
#   - product routes (/signin, /signup, /check-email, /demo, /app/*): SPA fallback, status 200
#   - anything else: branded 404 page with a real 404 status
# TLS, HSTS and the full security-header set from docs/07-security §5.9 are added in the
# production server block (Day 7); this file is the routing part, tested by scripts/ci/test-nginx.sh.

server {
    listen 8080;
    server_name _;
    root /srv/exit-brain/web;   # replaced by the test script / deploy
    index index.html;

    # Compress text assets (JS/CSS/HTML/XML/SVG). Fonts (woff2) and PNGs are already compressed.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json application/xml image/svg+xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Hashed build assets: cache for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Product routes are client-rendered from the SPA fallback.
    location ~ ^/(signin|signup|check-email|demo)/?$ {
        try_files /__spa-fallback.html =404;
    }
    location /app {
        try_files /__spa-fallback.html =404;
    }

    # Everything else must exist as a prerendered page or file.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404/index.html;
    location = /404/index.html {
        internal;
    }
}
