name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only reads the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Prerendered pages keep their content and metadata
        run: npm run verify:prerender
      - name: Scan bundle for secret material
        working-directory: .
        run: bash scripts/ci/scan-bundle.sh apps/web/build/client
      - name: Nginx routing (SPA fallback, real 404, gzip)
        working-directory: .
        run: |
          command -v nginx || (sudo apt-get update -qq && sudo apt-get install -y -qq nginx)
          bash scripts/ci/test-nginx.sh apps/web/build/client 8089
      - name: Single-file prototype still builds
        run: npm run build:prototype

  live-auth:
    name: Live auth E2E (real Supabase Auth, local stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.121.0
      # Auth (GoTrue), REST (PostgREST), gateway (Kong), Postgres and Mailpit only.
      - run: supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Build the app in live auth mode against the local stack
        working-directory: apps/web
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY)=')"
          npm ci --no-audit --no-fund
          VITE_AUTH_MODE=live VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_ANON_KEY="$ANON_KEY" npm run build
      - name: Run sign-up, confirmation and sign-in in a real browser
        working-directory: apps/web
        run: |
          npx playwright install --with-deps chromium
          node ../../scripts/ci/serve-web.mjs "$PWD/build/client" 5173 &
          for i in $(seq 1 20); do curl -sf -o /dev/null http://localhost:5173/ && break; sleep 0.5; done
          node e2e/live-auth.mjs
      - if: always()
        run: supabase stop --no-backup

  functions:
    name: Edge Functions (fmt, lint, check, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.x
      - run: deno fmt --check
      - run: deno lint
      - run: deno check api-*/index.ts tests/*.ts
      - run: deno test --allow-env tests/

  database:
    name: Database (migrations + pgTAP on Supabase local stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.121.0
      # Starts only Postgres (real Supabase image, real auth schema), applies migrations.
      - run: supabase db start
      - run: supabase test db
      - name: Every public table has RLS enabled
        run: |
          supabase db query --local "
            do \$\$
            declare missing text;
            begin
              select string_agg(c.relname, ', ') into missing
              from pg_class c join pg_namespace n on n.oid = c.relnamespace
              where n.nspname = 'public' and c.relkind = 'r' and not c.relrowsecurity;
              if missing is not null then
                raise exception 'tables without RLS: %', missing;
              end if;
            end \$\$;"
      - if: always()
        run: supabase stop --no-backup

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --no-banner --exit-code 1 /repo
